name: Imagen Docker

on:
  push:
    branches: [main]
    tags: ["v*"]
  schedule:
    - cron: "0 5 * * 1"   # cada lunes: base y ffmpeg al día
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=sha,format=short

      - id: version
        run: echo "version=$(date -u +%Y.%m.%d)-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          # Manifiesto Docker v2 simple, sin attestations: el aviso de actualización de Unraid
          # no entiende los índices OCI y marcaría el contenedor como «not available»
          provenance: false
          sbom: false
          outputs: type=image,oci-mediatypes=false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            CRIBA_VERSION=${{ steps.version.outputs.version }}
            CRIBA_COMMIT=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
