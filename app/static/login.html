<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#111214">
<title>Criba</title>
<link rel="icon" href="/static/icon.svg">
<link rel="manifest" href="/manifest.webmanifest">
<style>
  :root { --bg:#111214; --panel:#1b1d22; --line:#2c2f36; --text:#eceef2; --muted:#9aa0ab; --accent:#f2b84b; --bad:#ff7b72; }
  * { box-sizing:border-box; }
  body { margin:0; min-height:100vh; display:grid; place-items:center; background:var(--bg); color:var(--text);
         font:16px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif; padding:16px; }
  form { width:100%; max-width:340px; background:var(--panel); border:1px solid var(--line); border-radius:16px; padding:28px; }
  .logo { display:flex; align-items:center; gap:10px; font-size:22px; font-weight:700; margin-bottom:22px; }
  .logo img { width:36px; height:36px; }
  label { display:block; font-size:14px; color:var(--muted); margin-bottom:6px; }
  input { width:100%; font:inherit; padding:12px 14px; border-radius:10px; border:1px solid var(--line);
          background:var(--bg); color:var(--text); }
  input:focus { outline:2px solid var(--accent); outline-offset:1px; }
  button { width:100%; margin-top:16px; padding:12px; border:0; border-radius:10px; background:var(--accent);
           color:#1a1300; font:600 16px system-ui, sans-serif; cursor:pointer; }
  .err { color:var(--bad); font-size:14px; min-height:20px; margin-top:10px; }
</style>
</head>
<body>
<form method="post" action="/login">
  <div class="logo"><img src="/static/icon.svg" alt="">Criba</div>
  <label for="pw">Contraseña</label>
  <input id="pw" name="password" type="password" autocomplete="current-password" autofocus required>
  <input type="hidden" name="next" id="next" value="/">
  <button type="submit">Entrar</button>
  <div class="err">{{error}}</div>
</form>
<script>
  const n = new URLSearchParams(location.search).get("next");
  if (n) document.getElementById("next").value = n;
</script>
</body>
</html>
